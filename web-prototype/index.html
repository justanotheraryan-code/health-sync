<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0A0E1A" />
  <title>HealthBridge</title>

  <!-- PWA: installable + offline (matches the app's no-network design) -->
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="HealthBridge" />

  <!-- Inter for labels/headers/body, Roboto Mono for data values (per PRD typography roles) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Ambient deep-navy field behind the device, per PRD: "linear gradients of deep navy to near-black" -->
  <div class="ambient" aria-hidden="true"></div>

  <!-- The device. On desktop it reads as a phone; on mobile it fills the screen. -->
  <main class="device" role="application" aria-label="HealthBridge">
    <!-- Faux Android status bar for realism -->
    <div class="statusbar">
      <span class="statusbar__time" id="sb-time">9:41</span>
      <span class="statusbar__icons">
        <svg viewBox="0 0 18 12" width="17" height="11" aria-hidden="true"><path d="M1 11h2V7H1v4zm4 0h2V5H5v6zm4 0h2V3H9v8zm4 0h2V1h-2v10z" fill="currentColor"/></svg>
        <svg viewBox="0 0 16 12" width="15" height="11" aria-hidden="true"><path d="M8 2.6c2 0 3.9.8 5.3 2.1l1-1A9 9 0 0 0 8 .9 9 9 0 0 0 1.7 3.7l1 1A7.4 7.4 0 0 1 8 2.6zM4 7.7l1 1A4.3 4.3 0 0 1 8 7.4c1.1 0 2.2.4 3 1.3l1-1A5.7 5.7 0 0 0 8 6 5.7 5.7 0 0 0 4 7.7zM8 9.6 9.5 11 8 11 6.5 11 8 9.6z" fill="currentColor"/></svg>
        <svg viewBox="0 0 24 12" width="23" height="11" aria-hidden="true"><rect x="1" y="1.5" width="19" height="9" rx="2" stroke="currentColor" fill="none"/><rect x="2.5" y="3" width="14" height="6" rx="1" fill="currentColor"/><rect x="21" y="4" width="2" height="4" rx="1" fill="currentColor"/></svg>
      </span>
    </div>

    <!-- Screens are rendered into the stage by the router -->
    <div class="stage" id="stage"></div>

    <!-- Bottom-sheet host (settings confirmations etc.) -->
    <div class="sheet-host" id="sheet-host" aria-hidden="true"></div>

    <!-- Toast host -->
    <div class="toast-host" id="toast-host" aria-live="polite"></div>
  </main>

  <!-- Plain scripts (no build step, no ES-module CORS issues) sharing a global HB namespace -->
  <script src="data.js"></script>
  <script src="icons.js"></script>
  <script src="app.js"></script>
  <script src="screens.js"></script>
  <script>
    HB.boot();
    // register the offline service worker only when hosted (SW is unavailable on file://)
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
