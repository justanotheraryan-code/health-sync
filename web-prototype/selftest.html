<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SELFTEST pending</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="ambient"></div>
  <main class="device">
    <div class="statusbar"><span class="statusbar__time" id="sb-time">9:41</span></div>
    <div class="stage" id="stage"></div>
    <div class="sheet-host" id="sheet-host"></div>
    <div class="toast-host" id="toast-host"></div>
  </main>

  <script src="data.js"></script>
  <script src="icons.js"></script>
  <script src="app.js"></script>
  <script src="screens.js"></script>
  <script>
  /* Drives the real app through the entire flow, exercising real click
     handlers, and reports any thrown/async errors via document.title. */
  (function () {
    const errs = [], log = [];
    window.addEventListener('error', e => errs.push('window.onerror: ' + (e.message || (e.error && e.error.message))));
    window.addEventListener('unhandledrejection', e => errs.push('unhandledrejection: ' + (e.reason && (e.reason.message || e.reason))));

    const $ = (sel, i = 0) => document.querySelectorAll(sel)[i];
    const active = () => document.querySelector('#stage .screen.active');
    const screenIs = n => { const el = active(); return el && el.dataset.screen === n; };
    // "ready" = on the screen AND its transition has settled (so HB.go won't be dropped)
    const ready = n => screenIs(n) && !HB.isAnimating();
    const click = (sel, i = 0) => { const el = $(sel, i); if (!el) throw new Error('missing element: ' + sel); el.click(); };

    function step(name, fn) { try { fn(); log.push('OK   ' + name); } catch (e) { errs.push('STEP ' + name + ': ' + e.message); } }

    // poll until pred() is true (virtual time advances under --virtual-time-budget)
    function waitFor(desc, pred, then, timeout) {
      const start = performance.now();
      const iv = setInterval(() => {
        let ok = false; try { ok = pred(); } catch (e) {}
        if (ok) { clearInterval(iv); then(); }
        else if (performance.now() - start > (timeout || 4000)) { clearInterval(iv); errs.push('TIMEOUT waiting for: ' + desc + ' (on ' + (active() && active().dataset.screen) + ')'); finish(); }
      }, 40);
    }

    function finish() {
      const ok = errs.length === 0;
      document.title = 'SELFTEST ' + (ok ? 'PASS' : 'FAIL') + ' steps=' + log.length + ' errors=' + errs.length + (errs.length ? ' :: ' + errs.join(' || ') : '');
      const box = document.createElement('div');
      box.id = 'selftest-result';
      box.setAttribute('data-pass', ok ? '1' : '0');
      box.textContent = document.title;
      document.body.appendChild(box);
    }

    // ---- the scripted journey ----
    function run() {
      HB.boot(); // → onboarding
      waitFor('onboarding', () => screenIs('onboarding'), () => {
        step('onboarding next 1', () => click('.ob .btn--primary'));
        setTimeout(() => {
          step('onboarding next 2', () => click('.ob .btn--primary'));
          setTimeout(() => {
            step('onboarding grant', () => click('.ob .btn--primary'));
            afterHome();
          }, 300);
        }, 300);
      });
    }

    function afterHome() {
      waitFor('home', () => ready('home'), () => {
        step('home → import', () => click('.screen__footer .btn--primary'));
        waitFor('import', () => ready('import'), () => {
          step('open file picker', () => click('.dropzone'));
          waitFor('picker sheet', () => document.getElementById('sheet-host').classList.contains('is-open'), () => {
            step('select valid file', () => click('#sheet-host .srow', 0)); // main export
            waitFor('cta enabled', () => { const b = $('.screen__footer .btn--primary'); return b && !b.disabled; }, () => {
              step('start processing', () => click('.screen__footer .btn--primary'));
              waitFor('processing', () => ready('processing'), () => {
                // processing auto-advances (~5.2s) → delta
                waitFor('delta', () => ready('delta'), afterDelta, 12000);
              });
            });
          });
        });
      });
    }

    function afterDelta() {
      step('expand delta row', () => click('.drow'));
      setTimeout(() => {
        step('collapse delta row', () => click('.drow'));
        step('delta → writing', () => click('.screen__footer .btn--primary'));
        waitFor('writing', () => ready('writing'), () => {
          waitFor('write complete (Done enabled)', () => { const b = $('.screen__footer .btn--primary'); return b && !b.disabled; }, () => {
            step('writing → home (Done)', () => click('.screen__footer .btn--primary'));
            waitFor('home (post-sync)', () => ready('home'), () => {
              step('home → history', () => click('.slist .srow'));
              waitFor('history', () => ready('history'), () => {
                step('expand history row', () => click('.drow'));
                afterSettings();
              });
            });
          }, 6000);
        });
      }, 250);
    }

    function afterSettings() {
      // jump to settings and exercise toggles + destructive reset sheet
      step('go settings', () => HB.go('settings'));
      waitFor('settings', () => ready('settings'), () => {
        step('toggle a data type', () => { const cb = $('.switch input'); cb.checked = !cb.checked; cb.dispatchEvent(new Event('change')); });
        step('open reset confirm', () => { const rows = document.querySelectorAll('.slist .srow'); rows[rows.length - 1].click(); });
        waitFor('reset sheet', () => document.getElementById('sheet-host').classList.contains('is-open'), () => {
          step('confirm reset (danger)', () => click('#sheet-host .btn--danger'));
          setTimeout(finish, 400);
        });
      });
    }

    run();
  })();
  </script>
</body>
</html>
